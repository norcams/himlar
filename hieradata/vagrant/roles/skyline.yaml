---
include:
  default:
    - profile::application::openssl

profile::application::openssl::manage_ca_cert:  true
profile::application::openssl::certs:
  "skyline.%{hiera('domain_frontend')}":
    cn:     "skyline.%{hiera('domain_frontend')}"
    altnames:
      - "skyline.%{hiera('domain_frontend')}"

profile::openstack::skyline::allow_from_network:
  - '0.0.0.0/0'

# The whole repo is rsynced to /opt/himlar in the vm, so drop the wheels you
# built with provision/skyline/build-console.sh into provision/skyline/dist/
# and they are there when puppet runs. The directory is gitignored.
#
# The console version is the one pbr made up for the build: the fork has no
# release tags, so it falls back to 0.1.0.dev<commits>. Both the file name
# and "version" change every time you rebuild - update them together, or drop
# "version" to make puppet stop checking and only install once.
#
# Leave the apiserver on pypi unless you build that as well.
profile::openstack::skyline::wheels:
  skyline-apiserver:
    source:  'skyline-apiserver==8.0.0'
    version: '8.0.0'
  skyline-console:
    source:  '/opt/himlar/provision/skyline/dist/skyline_console-0.1.0.dev1781-py3-none-any.whl'
    version: '0.1.0.dev1781'

profile::openstack::skyline::config:
  default:
    debug: true
    # Self signed CA in vagrant
    cafile: '/etc/pki/tls/certs/cachain.pem'
  openstack:
    # No dataporten in vagrant, log in with a local keystone user
    sso_enabled: false
