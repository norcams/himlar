---
# The uplink interface
profile::base::network::uplink_interface: 'swp28s0'

bgp_loopback_addr: '10.255.253.2' # IP for elastic IP instances to peer to
bgp_loopback_addr6: 'fcfd::6:2'   # Needed for BGP-MP to work

profile::base::network::cumulus_interfaces:
  'eth0':
    'ipv4': "%{hiera('netcfg_mgmt_net_c6')}.2/21"
    'gateway': "%{hiera('netcfg_mgmt_gateway')}"
    'vrf': 'mgmt'
  'mgmt':
    'ipv4': '127.0.0.1/8'
    'vrf_table': 'auto'
  'lo':
    'ipv4': [ "%{hiera('bgp_loopback_addr')}/32", ]
    'ipv6': [ "%{hiera('bgp_loopback_addr6')}/128", ]
  'bridge.100':
    'ipv4': [ "%{hiera('netcfg_trp_net_c6')}.2/21", ]
    'ipv6': [ 'fd00::6:2/64', ]
    'virtual_ip': "%{hiera('netcfg_trp_net_c7')}.2/21 fd00::702/64"
    'virtual_mac': '00:00:5e:00:01:02'
  'bridge.109':
    'ipv4': [ "109.105.125.4/26", ]
    'ipv6': [ '2001:948:62:1::4/64', ]
    'virtual_ip':  '109.105.125.2/26 2001:948:62:1::f/64'
    'virtual_mac': '00:00:5e:00:01:03'
  'bridge.927':
    'ipv4': [ "192.168.243.3/24", ]
    'ipv6': [ 'fd00:192:168:243::3/64', ]
    'virtual_ip': '192.168.243.1/24 fd00:192:168:243::1/64'
    'virtual_mac': '00:00:5e:00:01:05'
  'peerlink.4094':
    'ipv4': [ '172.18.229.2/24', ]
    'ipv6': [ 'fd00:18:229::2/64', ]
    'clagd_enable': true
    'clagd_peer_ip': '172.18.229.1'
    'clagd_backup_ip': "%{hiera('netcfg_trp_net_c6')}.1"
    'clagd_sys_mac': '44:38:39:ff:bb:1d'
  'swp28s0':
    'ipv4': '158.36.4.67/31'
    'ipv6': '2001:700:0:80fa::1/127'
    'mtu':  '9178'
  'swp28s2':
    'mtu':  '9178'

#profile::network::leaf::switchd_conf:
#  'acl.non_atomic_update_mode':
#    line: 'acl.non_atomic_update_mode = TRUE'
#
#profile::network::leaf::acls:
#  '03span_custom.rules':
#    iptables:
#      - '-A FORWARD --in-interface swp28s0 -j SPAN --dport swp28s2'

frrouting::frrouting::bgp_vrf_options:
  'default':
    'bgp_as': "%{hiera('bgp_as')}"
    'common_cfg':
      - "bgp router-id %{ipaddress_trp1}"
      - 'bgp log-neighbor-changes'
      - 'bgp default local-preference 200'
      - 'maximum-paths ibgp 5'
      - 'bgp bestpath as-path multipath-relax'
      - 'neighbor 158.36.4.66 remote-as 224'
      - 'neighbor 158.36.4.66 bfd 5 500 500'
      - 'neighbor 2001:700:0:80fa:: remote-as 224'
      - 'neighbor 2001:700:0:80fa:: bfd 5 500 500'
      - "neighbor 172.18.6.1 remote-as %{hiera('bgp_as')}"
      - "neighbor 172.18.0.5 remote-as %{hiera('bgp_as')}"
      - 'neighbor 172.18.0.5 soft-reconfiguration inbound'
      - "neighbor fd00::5 remote-as %{hiera('bgp_as')}"
      - "neighbor fd00:18:229::1 remote-as %{hiera('bgp_as')}"
      - "neighbor 172.18.0.6 remote-as %{hiera('bgp_as')}"
      - "neighbor fd00::6 remote-as %{hiera('bgp_as')}"
      - 'neighbor 172.18.3.1 remote-as 65503'
      - 'neighbor fd00::3:1 remote-as 65503'
      - 'neighbor 172.18.3.2 remote-as 65503'
      - 'neighbor fd00::3:2 remote-as 65503'
      - 'neighbor 172.18.0.3 remote-as 65504'
      - 'neighbor 172.18.0.4 remote-as 65504'
    'address_family4_unicast':
      - 'neighbor 158.36.4.66 soft-reconfiguration inbound'
      - 'neighbor 158.36.4.66 prefix-list uninett-routes-in in'
      - 'neighbor 158.36.4.66 prefix-list uninett-routes-out out'
      - 'neighbor 172.18.6.1 soft-reconfiguration inbound'
      - 'neighbor 172.18.6.1 default-originate'
      - 'neighbor 172.18.6.1 route-map failover-default-route in'
      - 'neighbor fd00:18:229::1 soft-reconfiguration inbound'
      - 'neighbor 172.18.0.5 prefix-list leaf-v2-routes-in in'
      - 'neighbor 172.18.0.5 prefix-list leaf-v2-routes-out out'
      - 'neighbor fd00::5 soft-reconfiguration inbound'
      - 'neighbor fd00::5 prefix-list leaf-v2-routes-in in'
      - 'neighbor fd00::5 prefix-list leaf-v2-routes-out out'
      - 'neighbor 172.18.0.6 soft-reconfiguration inbound'
      - 'neighbor 172.18.0.6 prefix-list leaf-v2-routes-in in'
      - 'neighbor 172.18.0.6 prefix-list leaf-v2-routes-out out'
      - 'neighbor fd00::6 soft-reconfiguration inbound'
      - 'neighbor fd00::6 prefix-list leaf-v2-routes-in in'
      - 'neighbor fd00::6 prefix-list leaf-v2-routes-out out'
      - 'neighbor 172.18.3.1 prefix-list routes-from-leaf1 in'
      - 'neighbor 172.18.3.2 prefix-list routes-from-leaf1 in'
      - 'neighbor 172.18.0.3 prefix-list uib-routes-in in'
      - 'neighbor 172.18.0.3 prefix-list uib-routes-out out'
      - 'neighbor 172.18.0.4 prefix-list uib-routes-in in'
      - 'neighbor 172.18.0.4 prefix-list uib-routes-out out'
      - 'network 192.168.243.0/24'
      - 'network 158.37.43.0/24'
      - 'network 158.37.64.0/23'
      - 'network 158.39.74.0/24'
      - 'network 158.39.77.0/24'
      - 'network 158.39.201.0/24'
      - "network %{hiera('bgp_loopback_addr')}/32"
      - "network %{hiera('netcfg_priv_anycast_net')}/%{hiera('netcfg_priv_anycast_cidr4')}"
    'address_family6_unicast':
      - 'neighbor 2001:700:0:80fa:: activate'
      - 'neighbor 2001:700:0:80fa:: soft-reconfiguration inbound'
      - 'neighbor 2001:700:0:80fa:: prefix-list uninett-routes6-in in'
      - 'neighbor 2001:700:0:80fa:: prefix-list uninett-routes6-out out'
      - 'neighbor 172.18.0.3 activate'
      - 'neighbor 172.18.0.3 prefix-list uib-routes-in6 in'
      - 'neighbor 172.18.0.3 prefix-list uib-routes-out6 out'
      - 'neighbor 172.18.0.4 activate'
      - 'neighbor 172.18.0.4 prefix-list uib-routes-in6 in'
      - 'neighbor 172.18.0.4 prefix-list uib-routes-out6 out'
      - 'neighbor fd00::5 activate'
      - 'neighbor fd00::5 soft-reconfiguration inbound'
      - 'neighbor fd00::5 prefix-list leaf-v2-routes6-in in'
      - 'neighbor fd00::5 prefix-list leaf-v2-routes6-out out'
      - 'neighbor fd00::6 activate'
      - 'neighbor fd00::6 soft-reconfiguration inbound'
      - 'neighbor fd00::6 prefix-list leaf-v2-routes6-in in'
      - 'neighbor fd00::6 prefix-list leaf-v2-routes6-out out'
      - 'neighbor fd00:18:229::1 activate'
      - 'neighbor fd00:18:229::1 route-map failover-default-route6 in'
      - 'neighbor fd00:18:229::1 default-originate'
      - 'neighbor fd00:18:229::1 soft-reconfiguration inbound'
      - 'neighbor fd00::3:1 activate'
      - 'neighbor fd00::3:1 prefix-list routes-from-leaf1 in'
      - 'neighbor fd00::3:2 activate'
      - 'neighbor fd00::3:2 prefix-list routes-from-leaf1 in'
      - 'network fd00:192:168:243::/64'
      - 'network 2001:700:2:8300::/56'
      - 'network 2001:700:2:8c20::/59'
      - "network %{hiera('bgp_loopback_addr6')}/128"
