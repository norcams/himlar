---
network::interfaces_hash:
  eno1:
    ipv4:
      method:         'manual'
      address1:       '129.240.114.20/29'
      gateway:        '129.240.114.17'
  eno2:
    ipv4:
      method:         'manual'
      address1:       "%{hiera('netcfg_mgmt_netpart')}.10/%{hiera('netcfg_mgmt_cidr4')}" 
      never-default:  'true'
      dns:            "129.240.2.3;%{hiera('netcfg_dns_mgmt_server1')};%{hiera('netcfg_dns_mgmt_server2')}"
      dns-search:     "%{hiera('domain_mgmt')}"
  eno3:
    ipv4:
      method:         'manual'
      address1:       "%{hiera('netcfg_oob_netpart')}.10/%{hiera('netcfg_oob_cidr4')}" 

named_interfaces::config:
  mgmt:
    - eno2
  oob:
    - eno3
  public:
    - eno1

profile::bootstrap::himlar::manage_bootstrap_scripts: true

profile::base::common::manage_lvm: true
profile::base::lvm::physical_volume:
  '/dev/sdb':
    ensure: present
    force:  true
profile::base::lvm::volume_group:
  'vg_repo':
    physical_volumes:
      - /dev/sdb
profile::base::lvm::logical_volume:
  'lv_repo':
    volume_group: 'vg_repo'
    fs_type:      "xfs"
    mountpath:    "/opt/repo"
