---
network::interfaces_hash:
  br0: # mgmt
    connection_type:  'bridge'
    ipv4:
      address1:       "%{hiera('netcfg_mgmt_netpart')}.114/%{hiera('netcfg_mgmt_cidr4')}"
      dns:            "%{hiera('netcfg_dns_mgmt_server1')};%{hiera('netcfg_dns_mgmt_server2')};"
      dns-search:     "%{hiera('netcfg_dns_search_nm')}"
      gateway:        "%{hiera('netcfg_mgmt_gateway')}"
      method:         'manual'
    bridge:
      stp:            'false'
  br1: # trp
    connection_type:  'bridge'
    bridge:
      stp:            'false'
    ipv4:
      address:        "%{hiera('netcfg_trp_netpart')}.114/%{hiera('netcfg_trp_cidr4')}"
      never-default:  'true'
      method:         'manual'
  br2: # oob
    connection_type:  'bridge'
    bridge:
      stp:            'false'
  eth0: # mgmt
    controller:       'br0'
    ipv4: {}
    ipv6: {}
  eth0.3378: # oob
    connection_type:  'vlan'
    controller:       'br2'
    ipv4: {}
    ipv6: {}
    vlan:
      parent:         'eth0'
      id:             3378
      flags:          1
  #bond0-eth2: # trp
  #  interface_name:   'eth2'
  #  controller:       'bond0'
  #  port_type:        'bond'
  #  ipv4: {}
  #  ipv6: {}
  #  ethernet:
  #    mtu:  9000
  #bond0-eth3: # trp
  #  interface_name:   'eth3'
  #  controller:       'bond0'
  #  port_type:        'bond'
  #  ipv4: {}
  #  ipv6: {}
  #  ethernet:
  #    mtu:  9000
  #bond0:
  #  connection_type:  'bond'
  #  controller:       'br1'
  #  ipv4: {}
  #  ipv6: {}
  #  bond:
  #    mode: '802.3ad'              # the best and only supported mode with existing network config
  #    xmit_hash_policy: 'layer3+4' # please use this hash policy
  #  ethernet:
  #    mtu:  9000

profile::base::lvm::physical_volume:
  '/dev/disk/by-id/wwn-0x61866da0b060fc00328f25b013a2dbcf':
    ensure: present
    force:  true
profile::base::lvm::volume_group:
  'vg_ext':
    followsymlinks: true
    physical_volumes:
      - /dev/disk/by-id/wwn-0x61866da0b060fc00328f25b013a2dbcf
include:
  default:
    - profile::application::windowsimage

# bootstrap test02-admin-01 from this controller
profile::bootstrap::himlar::manage_bootstrap_scripts: true

# build windows only on this controller
profile::application::windowsimage::enable: true
profile::application::windowsimage::manage_firewall: true
profile::base::yumrepo::repo_hash:
  hashicorp:
    ensure: present
