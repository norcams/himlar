---
network::interfaces_hash:
  em1:
    ipv4:
      method:         'manual'
      address1:       "%{hiera('netcfg_mgmt_netpart')}.199/%{hiera('netcfg_mgmt_cidr4')}"
      dns:            "%{hiera('netcfg_dns_mgmt_server1')};%{hiera('netcfg_dns_mgmt_server2')}"
      dns-search:     "%{hiera('netcfg_dns_search_nm')}"
  em2:
    ipv4:
      method:         'manual'
      never-default:  'true'
      address1:       "%{hiera('netcfg_oob_netpart')}.199/21"
  bond0-p1p1: # public
    interface_name:   'p1p2'
    controller:       'bond0'
    port_type:        'bond'
    ipv4: {}
    ipv6: {}
#    ethernet:
#       mtu:  9000
  bond0-p1p2: # public
    interface_name:   'p1p2'
    controller:       'bond0'
    port_type:        'bond'
    ipv4: {}
    ipv6: {}
    #ethernet:
    #  mtu:  9000
  bond0:
    connection_type:  'bond'
    ipv4: {}
    ipv6: {}
    bond:
      mode: '802.3ad'              # the best and only supported mode with existing network config
      xmit_hash_policy: 'layer3+4' # please use this hash policy
    #ethernet:
    #  mtu:  9000

named_interfaces::config:
  mgmt:
    - em1
  oob:
    - em2
  public:
    - bond0

#profile::network::interface::manage_dummy:         true
#profile::network::interface::create_custom_routes: true

#profile::network::nat::enable_masquerade:          false
#profile::network::nat::enable_snat:                true
#profile::network::nat::source:                     "%{::network_mgmt1}/%{::netmask_mgmt1}"
#profile::network::nat::outiface:                   'eth1'

# puppet will not run until eth2 is created through virt-manager or something similar (connected to br3)
#profile::base::login::oob_outiface:                "%{::interface_oob1}"


# extra disk for local repository (synced with other login nodes)
profile::base::common::manage_lvm: true

profile::base::lvm::physical_volume:
  '/dev/sda4':
    ensure: present
    force:  true
profile::base::lvm::volume_group:
  'vg_misc':
    physical_volumes:
      - /dev/sda4
profile::base::lvm::logical_volume:
  'lv_repo':
    volume_group: 'vg_misc'
    fs_type:      "xfs"
    mountpath:    "/opt/repo"
    size:         '50G'
  'lv_home':
    volume_group: 'vg_misc'
    fs_type:      "xfs"
    mountpath:    "/home"
    size:         '200G'

# Enable db backup on 01
profile::base::login::manage_db_backup: false

# enable iaas account, but only make it available in the normal fashion
# from bgo-login-01
ssh::server::options:
  # No 2FA if coming from test01-login-01
  'Match User iaas Address 172.28.0.10':
    AuthenticationMethods: 'publickey'

accounts::accounts:
  'iaas':
    ensure: present
