---
network::interfaces_hash:
  eth0: # mgmt
    ipv4:
      address1:       "%{hiera('netcfg_mgmt_netpart')}.40/%{hiera('netcfg_mgmt_cidr4')}"
      gateway:        "%{hiera('netcfg_mgmt_gateway')}"
      dns:            "%{hiera('netcfg_dns_mgmt_server1')};%{hiera('netcfg_dns_mgmt_server2')}"
      dns-search:     "%{hiera('netcfg_dns_search_nm')}"
      method:         'manual'
  eth1: # trp
    ipv4:
      address1:       "%{hiera('netcfg_trp_netpart')}.40/%{hiera('netcfg_trp_cidr4')}"
      never-default:  'true'
      method:         'manual'

# FIXME: remove when this is in common roles
profile::application::report::package_url:      "https://download.iaas.uio.no/nrec/rpm/report-app-2.2.0-1.el9.x86_64.rpm"
