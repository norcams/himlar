---
# The uplink interface
profile::base::network::uplink_interface: 'swp28'

bgp_loopback_addr: '10.255.254.1' # IP for elastic IP instances to peer to
bgp_loopback_addr6: 'fcef::6:1'   # Needed for BGP-MP to work

profile::base::network::cumulus_interfaces:
  'eth0':
    'ipv4': "%{hiera('netcfg_mgmt_net_c6')}.1/21"
    'gateway': "%{hiera('netcfg_mgmt_gateway')}"
    'vrf': 'mgmt'
  'mgmt':
    'ipv4': '127.0.0.1/8'
    'vrf_table': 'auto'
  'lo':
    'ipv4': [ "%{hiera('bgp_loopback_addr')}/32", ]
    'ipv6': [ "%{hiera('bgp_loopback_addr6')}/128", ]
  'bridge.100':
    'ipv4': [ "%{hiera('netcfg_trp_net_c6')}.1/21", ]
    'ipv6': [ 'fd32::6:1/64', ]
    'virtual_ip': "%{hiera('netcfg_trp_net_c7')}.2/21 fd32::702/64"
    'virtual_mac': '00:00:5e:00:01:12'
  'peerlink.4094':
    'ipv4': [ '172.18.230.1/24', ]
    'ipv6': [ 'fd32:18:230::1/64', ]
    'clagd_enable': true
    'clagd_peer_ip': 'linklocal'
    'clagd_backup_ip': "%{hiera('netcfg_trp_net_c6')}.2"
    'clagd_sys_mac': '44:38:39:ff:bb:2d'
  'swp28':
    'ipv4':  '128.39.47.39/31'
    'ipv6':  '2001:700:0:8129::1/127'
    'mtu':   '9178'
    'speed': '100000'

frrouting::frrouting::bgp_vrf_options:
  'default':
    'bgp_as': "%{hiera('bgp_as')}"
    'common_cfg':
      - "bgp router-id %{ipaddress_trp1}"
      - 'bgp log-neighbor-changes'
      - 'bgp default local-preference 200'
      - 'maximum-paths ibgp 5'
      - 'bgp bestpath as-path multipath-relax'
      - 'neighbor 128.39.47.38 remote-as 224'
      - 'neighbor 128.39.47.38 bfd 5 500 500'
      - 'neighbor 2001:700:0:8129:: remote-as 224'
      - 'neighbor 2001:700:0:8129:: bfd 5 500 500'
      - "neighbor 172.18.38.2 remote-as %{hiera('bgp_as')}"
      - "neighbor fd32:18:230::2 remote-as %{hiera('bgp_as')}"
      - 'neighbor fd32:18:230::2 soft-reconfiguration inbound'
    'address_family4_unicast':
      - 'neighbor 128.39.47.38 prefix-list uninett-routes-in in'
      - 'neighbor 128.39.47.38 prefix-list uninett-routes-out out'
      - 'neighbor 128.39.47.38 soft-reconfiguration inbound'
      - 'neighbor 172.18.38.2 default-originate'
      - 'neighbor 172.18.38.2 soft-reconfiguration inbound'
      - 'neighbor 172.18.38.2 route-map failover-default-route in'
      - 'network 78.91.122.0/23'
      - 'network 158.37.63.0/24'
      - 'network 158.37.66.0/24'
      - 'network 158.39.48.0/24'
      - 'network 158.39.75.0/24'
      - 'network 158.39.200.0/24'
      - "network %{hiera('bgp_loopback_addr')}/32"
      - "network %{hiera('netcfg_priv_anycast_net')}/%{hiera('netcfg_priv_anycast_cidr4')}"
    'address_family6_unicast':
      - 'neighbor 2001:700:0:8129:: activate'
      - 'neighbor 2001:700:0:8129:: soft-reconfiguration inbound'
      - 'neighbor 2001:700:0:8129:: prefix-list uninett-routes6-in in'
      - 'neighbor 2001:700:0:8129:: prefix-list uninett-routes6-out out'
      - 'neighbor fd32:18:230::2 activate'
      - 'neighbor fd32:18:230::2 route-map failover-default-route6 in'
      - 'neighbor fd32:18:230::2 default-originate'
      - 'neighbor fd32:18:230::2 soft-reconfiguration inbound'
      - 'network 2001:700:2:8200::/56'
      - 'network 2001:700:2:8c00::/59'
      - "network %{hiera('bgp_loopback_addr6')}/128"
