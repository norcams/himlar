---
# FIXME: this can be removed when all admin run same version on el9
profile::base::common::packages:
  'ruby': #FIXME: remove from common to avoid this override when all admin run el9
    ensure: present
    provider: 'dnf'
    enable_only: false

foreman_version: '3.12'

# postgresql 13 is default in el9
postgresql::globals::version: '13'


profile::base::common::manage_lvm: true
profile::base::lvm::physical_volume:
  '/dev/vda3':
    ensure: present
    force:  true
profile::base::lvm::volume_group:
  'vg_repo':
    physical_volumes:
      - /dev/vda3
profile::base::lvm::logical_volume:
  'lv_repo':
    volume_group: 'vg_repo'
    fs_type:      "xfs"
    mountpath:    "/opt/repo"

