---
profile::bootstrap::himlar::libvirt:
  '%{::location}-admin-01':
    libvirt_pool:     'dirpool'
    libvirt_network:  'directnet'
    puppet_env:       'admin_el9' #FIXME change to admin after all run el9
    node_ip:          "%{hiera('netcfg_mgmt_netpart')}.11"
    node_netmask:     '%{::netmask_mgmt1}'
    node_gateway:     "%{hiera('netcfg_mgmt_netpart')}.10"
    os_variant:       'almalinux9'
    root_size:        30
    maxsize:          18240
    vm_vcpus:         4
    vm_memory:        16192
    vm_console:       'ttyS0'

lvm::volume_groups: {} # override config in common
profile::base::lvm::physical_volume:
  '/dev/sda':
    ensure: present
    force:  true
profile::base::lvm::volume_group:
  'vg_ext':
    physical_volumes:
      - /dev/sda
profile::base::lvm::logical_volume:
  'lv_instances':
    volume_group: 'vg_ext'
    fs_type:      "xfs"
    mountpath: "/var/lib/libvirt/images"
