---
profile::bootstrap::himlar::libvirt:
  '%{location}-admin-01':
    domain:          '%{domain}'
    libvirt_pool:    'dirpool'
    libvirt_network: 'directnet'
    install_ip:      '172.28.32.11'
    install_netmask: '255.255.255.0'
    install_gateway: '172.28.32.10'
    vm_console:       false
    use_dhcp:         false

lvm::volume_groups: {} # override config in common
profile::base::lvm::physical_volume:
  '/dev/sda':
    ensure: present
    force:  true
profile::base::lvm::volume_group:
  'vg_ext':
    physical_volumes:
      - /dev/sda
profile::base::lvm::logical_volume:
  'lv_instances':
    volume_group: 'vg_ext'
    fs_type:      "xfs"
    mountpath: "/var/lib/libvirt/images"
