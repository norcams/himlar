---
# Himlar bootstrap
profile::bootstrap::himlar::manage_bootstrap_scripts: true
profile::bootstrap::himlar::tftp:
  '%{location}-controller-04':
    puppet_env:       'controller'
    dhcp_range_start: "%{hiera('netcfg_mgmt_netpart')}.200"
    dhcp_range_end:   "%{hiera('netcfg_mgmt_netpart')}.250"
    dhcp_gateway:     "%{hiera('netcfg_mgmt_netpart')}.10" # use login as gateway
    # node_ip:          "%{hiera('netcfg_mgmt_netpart')}.100"
    # node_netmask:     "%{hiera('netcfg_mgmt_netmask')}"
    # node_gateway:     "%{hiera('netcfg_mgmt_netpart')}.10"
    use_dhcp:         true
    kernel_opts:        'net.ifnames=0 biosdevnames=1'

# we disable deep merge in test02/modules/accounts.yaml
# so we need all here not only iaas absent
accounts::accounts:
  'mikaeld':
    ensure: present
  'raymond':
    ensure: present
    authorized_keys: [ 'raymond_uib', 'raymond_home']
  'trondham':
    ensure: present
  'erikberg':
    ensure: present
  'lennart':
    ensure: present
    authorized_keys: [ 'lennart_uib', 'lennart_home']
  'terjef':
    ensure: present
    authorized_keys: [ 'terjef', 'terjef_basement']
  'torldre':
    ensure: present
  'erlenboh':
    ensure: present
  'ivarth':
    ensure: present
  # disable system users
  'norcams':
    ensure: absent
  'iaas':
    ensure: absent
  'vagrant':
    ensure: absent
