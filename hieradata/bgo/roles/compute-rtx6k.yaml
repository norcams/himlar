profile::base::lvm::physical_volume:
  '/dev/disk/by-id/wwn-0x600062b21246e680317dd4b927d60a98-part4':
    ensure: present
    force:  true
  '/dev/disk/by-id/wwn-0x600062b21246e680317dd4a509f949d3':
    ensure: present
    force:  true
profile::base::lvm::volume_group:
  'vg_instances':
    followsymlinks: true
    physical_volumes:
      - /dev/disk/by-id/wwn-0x600062b21246e680317dd4a509f949d3
  'vg_ext':
    followsymlinks: true
    physical_volumes:
      - /dev/disk/by-id/wwn-0x600062b21246e680317dd4b927d60a98-part4
profile::base::lvm::logical_volume:
  'lv_instances':
    volume_group: 'vg_instances'
    fs_type:      "xfs"
    mountpath:    "/var/lib/nova/instances"


profile::base::common::packages:
  'wget': {}
  'kernel-devel': {}
  'kernel-headers': {}
  'unzip': {}
#  'NVIDIA-vGPU-rhel': { ## FIXME: There is currently no RPM for EL9.8, use run file for now
#    source: 'http://repo.mgmt.bgo.uhdc.no/NVIDIA-vGPU-rhel-7.8-450.55.x86_64.rpm'
#  }

## GPU passthrough host ##

# Blacklist nouveau (still required so the cards are free to bind vfio-pci)
profile::base::physical::blacklist_drv: true
profile::base::physical::blacklist_drv_list:
  'nouveau': {}

# Bind the four RTX PRO 6000 PFs to vfio-pci at boot (this profile handles the
# modprobe.d + dracut + initramfs wiring). This is the RIGHT use of the vfio
# profile — the one to AVOID on a vGPU host, correct on a passthrough host.
profile::base::physical::enable_vfio_pci: true
profile::base::physical::vfio_pci_ids: '10de:2bb5'

# IMPORTANT: do NOT install the NVIDIA vGPU manager on this host.
# Passthrough needs no host NVIDIA driver at all — the guest owns the GPU.

# Nova PCI passthrough (OpenStack Zed / Nova 26)
profile::openstack::compute::pci_passthrough::manage_pcipassthrough: true
profile::openstack::compute::pci_passthrough::manage_pci_whitelist: true

nova::compute::pci::passthrough:
  - vendor_id: '10de'
    product_id: '2bb5'

nova::pci::aliases:
  - vendor_id: '10de'
    product_id: '2bb5'
    device_type: 'type-PF'    # whole physical function
    name: 'rtx6k'

# 4 GPUs => at most 4 GPU instances on this host
nova::scheduler::filter::max_instances_per_host: '4'

## Virt / CPU ##
profile::virtualization::nested::module: 'kvm_amd'
profile::virtualization::nested::value: '0'

nova::compute::libvirt::cpu_mode: 'custom'
nova::compute::libvirt::cpu_models: ['EPYC-Genoa']   # safe floor for EPYC 9355 (Turin)
nova::cpu_allocation_ratio: '1.1'
nova::disk_allocation_ratio: '1.1'
nova::ram_allocation_ratio: '1.1'   # NB: passthrough guests pin RAM; ratio is moot for them

# Local storage for instances
nova::compute::rbd::ephemeral_storage: false
nova::compute::libvirt::images_type: 'default'

nova::config::nova_config:
  DEFAULT/metadata_workers:
    value: '4'
