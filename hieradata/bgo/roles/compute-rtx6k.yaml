---
# NVIDIA SR-IOV-based vGPU hosts need SR-IOV enabled and mdevs created
include:
  kickstart:
    - profile::openstack::compute::pci_passthrough
  default:
    - profile::openstack::compute::pci_passthrough

profile::base::network::nm_network_auto_bonding:
  trp:
    eth0:
      ethernet:
        'mtu': '9000' # the MTU size must be set also on the slave interfaces
    eth1:
      ethernet:
        'mtu': '9000'

#FIXME:el9 move to common after all computes are el9 with zed
openstack_version: "zed"
named_interfaces::config:
  mgmt:
  - p1p1
  trp:
  - bond0
  live:
  - bond0.120


## Sensu 
sensu::agent::subscriptions:
  - 'base'
  - 'metrics'
  - 'compute'
  - 'physical'

#profile::base::physical::enable_l40s_pci_check:  true

# Influx
gpu_influxdb_bucket: "gpu"
profile::monitoring::telegraf::enable_telegraf:     true
profile::monitoring::telegraf::outputs:
  influxdb_v2:
    options:
      - urls: ["https://%{hiera('mgmt__address__influx')}:8086"]
        tls_ca: '/etc/puppetlabs/puppet/ssl/certs/ca.pem'
        token: "%{hiera('influxdb_admin_token')}"
        organization: "%{hiera('profile::monitoring::influxdb::org')}"
        bucket: "%{hiera('gpu_influxdb_bucket')}"
        insecure_skip_verify: true
        tagpass:
          bucket: ["%{hiera('gpu_influxdb_bucket')}"]

profile::monitoring::telegraf::inputs:
#  prometheus:
#    options:
#      - urls: ["http://%{::ipaddress_mgmt1}:9400/metrics"]
#        metric_version: 2
#        tags:
#          bucket: "%{hiera('ceph_influxdb_bucket')}"
  nvidia_smi:
    options:
      - tags:
          bucket: "%{hiera('gpu_influxdb_bucket')}"


# Enable extra yum repo vGPU drivers
profile::base::yumrepo::repo_hash:
  nrec-nonfree:
    ensure: present



## Custom Sensu checks FIXME:sensu-go
