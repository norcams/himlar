---
# Enable osl skyline only from some network, same list as roles/dashboard.yaml
profile::openstack::skyline::allow_from_network:
  - '129.240.114.45/32'  # osl-login
  - '158.37.63.0/24'     # osl
  - '129.177.10.189/32'  # tor
  - '129.177.10.212/32'  # raymond
  - '129.240.130.12/32'  # trond
  - '129.240.130.124/32' # mikaeld
  - '129.240.130.171/32' # ivar
  - '129.177.6.96/32'    # uib-ha-01
  - '129.177.6.97/32'    # uib-ha-01

profile::openstack::skyline::allow_from_network6:
  - '2001:700:100:4003::43'  # trond
  - '2001:700:100:4003::17'  # mikael
  - '2001:700:100:4003::27'  # ivar

profile::openstack::skyline::manage_firewall6: true

profile::openstack::skyline::server_name: "%{hiera('public__address__skyline_osl')}"
profile::openstack::skyline::ssl_cert:    "/etc/pki/tls/certs/%{hiera('public__address__skyline_osl')}.cert.pem"
profile::openstack::skyline::ssl_key:     "/etc/pki/tls/private/%{hiera('public__address__skyline_osl')}.key.pem"
